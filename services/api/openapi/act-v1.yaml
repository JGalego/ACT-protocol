openapi: 3.1.0
info:
  title: ACT Protocol Reference API
  version: '1.0.0-rc.1'
  summary: Reference implementation of a subset of the ACT 1.0 /v1 HTTP contract.
  description: >
    This document describes the endpoints actually implemented by services/api in this release candidate. Request bodies for write endpoints are DSSE-compatible signed event envelopes; their authoritative shape is defined by the JSON Schemas under /schemas (schemas/envelope/signed-envelope.schema.json and schemas/event/unsigned-event.schema.json), which the server validates every request against. This OpenAPI document is kept in sync by hand with services/api/src/routes/*.ts; docs/api-reference.md links each operation back to its handler and to conformance/fixtures.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: /v1
security:
  - bearerAuth: []
paths:
  /health/live:
    get:
      operationId: healthLive
      summary: Liveness probe
      security: []
      responses:
        '200':
          {
            description: OK,
            content: { application/json: { schema: { $ref: '#/components/schemas/Status' } } },
          }
  /health/ready:
    get:
      operationId: healthReady
      summary: Readiness probe (performs a real read against the configured storage backend)
      security: []
      responses:
        '200':
          {
            description: OK,
            content: { application/json: { schema: { $ref: '#/components/schemas/Status' } } },
          }
        '503': { description: Storage backend unreachable }
  /metrics:
    get:
      operationId: metrics
      summary: Prometheus text-format process metrics (uptime, memory)
      security: []
      responses:
        '200': { description: OK, content: { text/plain: { schema: { type: string } } } }
  /ledger:
    get:
      operationId: getLedgerIdentity
      summary: This ledger's public identity (ledger id, receipt-signing key id and public key), for pinning by a federation peer
      responses:
        '200': { description: OK }
  /schemas:
    get:
      operationId: listSchemas
      summary: Lists the canonical schema $ids this server validates against
      security: []
      responses:
        '200': { description: OK }
  /keys:
    post:
      operationId: registerKey
      summary: >
        Registers a new Ed25519 key via self-signed proof of possession (trust bootstrap), or records a key status change (key_rotated / key_revoked / key_compromised) signed by a currently trusted key of the same owner. The key_id MUST be the fingerprint of the public key (ed25519:<sha-256 of the raw key>) and the event's actor MUST be the key's owner. When ACT_KEY_REGISTRATION=admin (the production default) only administrators may register a key. A revoked or compromised key is refused for all later writes (403 untrusted_actor).
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: '#/components/schemas/SignedEnvelope' } } },
        }
      responses:
        '201':
          {
            description: Created,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/AppendResult' } } },
          }
        '400': { $ref: '#/components/responses/Problem' }
  /actors:
    post:
      operationId: registerActor
      summary: Registers an Actor (signing key must already be registered via POST /v1/keys)
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: '#/components/schemas/SignedEnvelope' } } },
        }
      responses:
        '201':
          {
            description: Created,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/AppendResult' } } },
          }
        '400': { $ref: '#/components/responses/Problem' }
  /intents:
    post:
      operationId: submitIntent
      summary: Submits an Intent genesis, revision, or authority-selection event
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: '#/components/schemas/SignedEnvelope' } } },
        }
      responses:
        '201':
          {
            description: Created,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/AppendResult' } } },
          }
        '400': { $ref: '#/components/responses/Problem' }
  /transformations:
    post:
      operationId: submitTransformation
      summary: Records a Transformation
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: '#/components/schemas/SignedEnvelope' } } },
        }
      responses:
        '201':
          {
            description: Created,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/AppendResult' } } },
          }
        '400': { $ref: '#/components/responses/Problem' }
  /artifacts:
    post:
      operationId: submitArtifact
      summary: Submits a generic artifact-version event (any artifact type without its own dedicated endpoint)
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: '#/components/schemas/SignedEnvelope' } } },
        }
      responses:
        '201':
          {
            description: Created,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/AppendResult' } } },
          }
        '400': { $ref: '#/components/responses/Problem' }
  /artifacts/{id}:
    get:
      operationId: getArtifact
      summary: Gets the current head (latest accepted version) of a logical artifact
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/Problem' }
  /artifacts/{id}/versions:
    get:
      operationId: listArtifactVersions
      summary: Lists every accepted event for a logical artifact, oldest first
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK }
  /artifacts/{id}/diff:
    get:
      operationId: diffArtifactVersions
      summary: Structural diff between two versions of a logical artifact
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - name: from
          in: query
          required: true
          description: The version_id to diff from.
          schema: { type: string }
        - name: to
          in: query
          required: true
          description: The version_id to diff to.
          schema: { type: string }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /approval-requests:
    post:
      operationId: submitApprovalRequest
      summary: Submits an Approval Request
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: '#/components/schemas/SignedEnvelope' } } },
        }
      responses:
        '201':
          {
            description: Created,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/AppendResult' } } },
          }
  /approval-decisions:
    post:
      operationId: submitApprovalDecision
      summary: Submits an Approval Decision (approved / rejected / changes_requested / revoked / expired / cancelled)
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: '#/components/schemas/SignedEnvelope' } } },
        }
      responses:
        '201':
          {
            description: Created,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/AppendResult' } } },
          }
  /approvals/{id}:
    get:
      operationId: getApproval
      summary: Gets a specific approval-related event by its event id
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK }
  /challenges:
    post:
      operationId: submitChallenge
      summary: Raises or resolves a Challenge
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: '#/components/schemas/SignedEnvelope' } } },
        }
      responses:
        '201':
          {
            description: Created,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/AppendResult' } } },
          }
    get:
      operationId: listChallenges
      summary: Cursor-paginated list of every challenge_raised/challenge_resolved event
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        '200': { description: OK }
  /verifications:
    post:
      operationId: submitVerification
      summary: Records a Verification Report
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: '#/components/schemas/SignedEnvelope' } } },
        }
      responses:
        '201':
          {
            description: Created,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/AppendResult' } } },
          }
  /verifications/{id}:
    get:
      operationId: getVerification
      summary: Gets a specific verification event by its event id
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK }
  /policies:
    post:
      operationId: publishPolicy
      summary: Publishes a new Policy version
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: '#/components/schemas/SignedEnvelope' } } },
        }
      responses:
        '201':
          {
            description: Created,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/AppendResult' } } },
          }
  /lineage/{id}:
    get:
      operationId: getLineage
      summary: Bounded lineage traversal (ancestors, descendants, and any missing-parent boundaries) around an event
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - name: maxDepth
          in: query
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/Problem' }
  /history/{id}:
    get:
      operationId: getHistory
      summary: Full ordered version history for a logical artifact
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK }
  /events:
    get:
      operationId: listEvents
      summary: Cursor-paginated list of every accepted event, in acceptance order, optionally filtered
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500 }
        - name: eventType
          in: query
          description: Only return events with this exact event_type.
          schema: { type: string }
        - name: subjectKind
          in: query
          description: Only return events whose subject.kind matches.
          schema: { type: string, enum: [artifact, transformation, attestation, policy, evidence] }
      responses:
        '200': { description: OK }
  /bundles/export:
    post:
      operationId: exportBundle
      summary: >
        Exports a signed event bundle (optionally scoped to a set of artifact ids). completeness.scope is computed: `complete` only if every causal parent of every included event is also included, otherwise `partial` with each gap listed in known_gaps.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { artifactIds: { type: array, items: { type: string } } }
      responses:
        '200': { description: OK }
  /bundles/import:
    post:
      operationId: importBundle
      summary: >
        Imports a signed event bundle (administrators only). The bundle MUST name a registered federation peer, its bundle_id MUST be the digest of its body, and it MUST be signed by the key pinned for that peer; otherwise the whole bundle is rejected (403 untrusted_source_ledger / invalid_bundle_signature, 400 bundle_digest_mismatch). Each event's source receipt is verified against the peer key, and a missing causal parent is tolerated only where the bundle declares the gap in completeness.known_gaps. Any event that fails is quarantined with a reason.
      requestBody:
        {
          required: true,
          content: { application/json: { schema: { $ref: '#/components/schemas/Bundle' } } },
        }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/Problem' }
  /quarantine:
    get:
      operationId: listQuarantine
      summary: Lists quarantined (rejected) import events with their rejection reason (administrators only)
      responses:
        '200': { description: OK }
  /federation/peers:
    post:
      operationId: registerFederationPeer
      summary: >
        Registers another independently-hosted ACT ledger as a federation peer (administrators only). Registration is an explicit trust decision that pins the peer's ledger id and signing key, which the operator obtains out of band (the peer's GET /v1/ledger). The URL must be http(s) without embedded credentials and, unless ACT_ALLOW_PRIVATE_PEERS is set, must not point at a loopback, private, or link-local address. The response never includes the bearer token.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [url, ledgerId, ledgerKeyId, ledgerPublicKey]
              properties:
                url: { type: string, description: 'Peer base URL, e.g. https://peer.example.org' }
                label: { type: string }
                bearerToken:
                  {
                    type: string,
                    description: 'Sent to the peer on outgoing calls; never returned',
                  }
                ledgerId: { type: string, description: "The peer ledger's UUID" }
                ledgerKeyId:
                  {
                    type: string,
                    description: "The peer ledger's receipt-signing key id (must be the fingerprint of ledgerPublicKey)",
                  }
                ledgerPublicKey: { type: string, description: 'Base64 raw Ed25519 public key' }
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listFederationPeers
      summary: Lists registered federation peers (administrators only; bearer tokens are never returned)
      responses:
        '200': { description: OK }
  /federation/peers/{peerId}:
    delete:
      operationId: removeFederationPeer
      summary: Removes a registered federation peer (administrators only)
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/Problem' }
  /federation/pull:
    post:
      operationId: pullFromPeer
      summary: >
        Fetches a bundle from a registered peer's /v1/bundles/export and imports it into this ledger, surfacing any forks (informational) or equivocation (adversarial) findings (spec/federation.md section 6) rather than silently accepting or rejecting them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [peerId]
              properties:
                peerId: { type: string }
                artifactIds: { type: array, items: { type: string } }
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /federation/push:
    post:
      operationId: pushToPeer
      summary: Exports a bundle from this ledger and imports it into a registered peer's /v1/bundles/import
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [peerId]
              properties:
                peerId: { type: string }
                artifactIds: { type: array, items: { type: string } }
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Two schemes, mutually exclusive by environment. Local development (ACT_DEV_MODE=true, refused in production): the bearer token is taken directly as the caller's actor id, used for tenant scoping and rate limiting. Production (ACT_OIDC_ISSUER + ACT_OIDC_AUDIENCE configured): the bearer token MUST be a JWT issued by that OIDC provider, verified against its JWKS for signature, issuer, audience, and expiry; its `sub` claim becomes the caller's actor id and its `act_tenant` claim (default `"default"`) becomes the tenant id. Neither scheme authorizes any ledger write on its own -- every write additionally requires the submitted event envelope to carry a valid Ed25519 signature from a registered key.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    Problem:
      description: RFC 9457 Problem Details
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
  schemas:
    Status:
      type: object
      properties: { status: { type: string, enum: [ok] } }
    SignedEnvelope:
      type: object
      description: See schemas/envelope/signed-envelope.schema.json for the authoritative shape.
      additionalProperties: true
    Bundle:
      type: object
      description: See schemas/federation/bundle.schema.json for the authoritative shape.
      additionalProperties: true
    AppendResult:
      type: object
      properties:
        eventId: { type: string }
        sequence: { type: integer }
        duplicate: { type: boolean }
        receipt: { type: object }
    ProblemDetails:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
