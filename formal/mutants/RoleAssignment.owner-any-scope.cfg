\* Mutant: an owner of one scope may grant in any scope
\* EXPECT: GrantsAuthorized
CONSTANTS
  Principals = {"adm", "p1", "p2"}
  Admin = "adm"
  Roles = {"owner", "approver"}
  Scopes = {"s1", "s2"}
  MaxAssignments = 3
  CheckIssuer = TRUE
  ScopedOwner = FALSE
  NoSelfGrant = TRUE
  HonourStatus = TRUE
  HonourExpiry = TRUE
  TerminalFinal = TRUE
  ReviseAuth = TRUE

SPECIFICATION Spec
INVARIANT GrantsAuthorized
CHECK_DEADLOCK FALSE
