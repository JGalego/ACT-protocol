\* Mutant: an ended or revoked assignment still confers its role
\* EXPECT: DecisionsAuthorized
CONSTANTS
  Principals = {"adm", "p1", "p2"}
  Admin = "adm"
  Roles = {"owner", "approver"}
  Scopes = {"s1", "s2"}
  MaxAssignments = 3
  CheckIssuer = TRUE
  ScopedOwner = TRUE
  NoSelfGrant = TRUE
  HonourStatus = FALSE
  HonourExpiry = TRUE
  TerminalFinal = TRUE
  ReviseAuth = TRUE

SPECIFICATION Spec
INVARIANT DecisionsAuthorized
CHECK_DEADLOCK FALSE
