\* Mutant: an owner may grant a role to themselves
\* EXPECT: GrantsAuthorized
CONSTANTS
  Principals = {"adm", "p1", "p2"}
  Admin = "adm"
  Roles = {"owner", "approver"}
  Scopes = {"s1", "s2"}
  MaxAssignments = 3
  CheckIssuer = TRUE
  ScopedOwner = TRUE
  NoSelfGrant = FALSE
  HonourStatus = TRUE
  HonourExpiry = TRUE
  TerminalFinal = TRUE
  ReviseAuth = TRUE

SPECIFICATION Spec
INVARIANT GrantsAuthorized
CHECK_DEADLOCK FALSE
