\* Mutant: the first/latest proposal silently becomes effective without an authorized selection
\* EXPECT: EffectiveOnlyBySelection
CONSTANTS
  Versions = {"v1", "v2"}
  Actors = {"a1", "a2", "a3"}
  Owners = {"a1", "a2"}
  Quorum = 2
  SeparationOfDuties = TRUE
  CheckAuthority = TRUE
  CheckDuty = TRUE
  CheckDistinct = TRUE
  Supersede = TRUE
  NoAutoPick = FALSE
SPECIFICATION Spec
INVARIANT EffectiveOnlyBySelection
CHECK_DEADLOCK FALSE
