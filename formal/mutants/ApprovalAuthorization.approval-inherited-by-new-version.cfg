  Reviewers = {"r", "s", "author"}
  Author = "author"
  Eligible = {"r", "s", "author"}
  Versions = {"v1", "v2"}
  Quorum = 2
  MaxTime = 1
  SeparationOfDuties = TRUE
  ImplSubject = FALSE
  ImplState = TRUE
  ImplExpiry = TRUE
  ImplDistinct = TRUE
  ImplDuty = TRUE
  ImplRole = TRUE
  ImplVerdict = TRUE
SPECIFICATION Spec
INVARIANT NoInheritedApproval
CHECK_DEADLOCK FALSE
