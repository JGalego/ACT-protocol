\* Mutant: anyone may end or revoke someone else's assignment
\* EXPECT: ChangesAuthorized
CONSTANTS
  Principals = {"adm", "p1", "p2"}
  Admin = "adm"
  Roles = {"owner", "approver"}
  Scopes = {"s1", "s2"}
  MaxAssignments = 3
  CheckIssuer = TRUE
  ScopedOwner = TRUE
  NoSelfGrant = TRUE
  HonourStatus = TRUE
  HonourExpiry = TRUE
  TerminalFinal = TRUE
  ReviseAuth = FALSE

SPECIFICATION Spec
INVARIANT ChangesAuthorized
CHECK_DEADLOCK FALSE
