\* Mutant: anyone may grant a role, not only an administrator or an owner
\* EXPECT: GrantsAuthorized
CONSTANTS
  Principals = {"adm", "p1", "p2"}
  Admin = "adm"
  Roles = {"owner", "approver"}
  Scopes = {"s1", "s2"}
  MaxAssignments = 3
  CheckIssuer = FALSE
  ScopedOwner = TRUE
  NoSelfGrant = TRUE
  HonourStatus = TRUE
  HonourExpiry = TRUE
  TerminalFinal = TRUE
  ReviseAuth = TRUE

SPECIFICATION Spec
INVARIANT GrantsAuthorized
CHECK_DEADLOCK FALSE
