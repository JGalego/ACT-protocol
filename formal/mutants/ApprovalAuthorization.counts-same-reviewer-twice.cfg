\* Mutant: quorum counts decisions rather than distinct reviewers (one reviewer deciding two requests for the same subject would count twice)
\* EXPECT: ImplMatchesSpec
CONSTANTS
  Reviewers = {"r", "s", "author"}
  Author = "author"
  Eligible = {"r", "s", "author"}
  Versions = {"v1", "v2"}
  Quorum = 2
  MaxTime = 1
  SeparationOfDuties = TRUE
  ImplSubject = TRUE
  ImplState = TRUE
  ImplExpiry = TRUE
  ImplDistinct = FALSE
  ImplDuty = TRUE
  ImplRole = TRUE
  ImplVerdict = TRUE
SPECIFICATION Spec
INVARIANT ImplMatchesSpec
CHECK_DEADLOCK FALSE
