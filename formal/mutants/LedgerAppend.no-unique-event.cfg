\* Mutant: event ids are not unique: a duplicate submission that passed the (outside-the-transaction) duplicate check commits a second receipt
\* EXPECT: NoDuplicateReceipts
CONSTANTS
  Workers = {"w1", "w2", "w3"}
  MaxAttempts = 3
  UniqueSeq = TRUE
  UniqueEvent = FALSE
  Atomic = TRUE
SPECIFICATION Spec
INVARIANT NoDuplicateReceipts
CHECK_DEADLOCK FALSE
