\* Mutant: an ended or revoked assignment can become active again
\* EXPECT: TerminalIsFinal
CONSTANTS
  Principals = {"adm", "p1", "p2"}
  Admin = "adm"
  Roles = {"owner", "approver"}
  Scopes = {"s1", "s2"}
  MaxAssignments = 3
  CheckIssuer = TRUE
  ScopedOwner = TRUE
  NoSelfGrant = TRUE
  HonourStatus = TRUE
  HonourExpiry = TRUE
  TerminalFinal = FALSE
  ReviseAuth = TRUE

SPECIFICATION Spec
INVARIANT TerminalIsFinal
CHECK_DEADLOCK FALSE
