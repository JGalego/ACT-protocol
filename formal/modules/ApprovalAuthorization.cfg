\* "r" and "s" are eligible reviewers; the author may also (wrongly) approve their
\* own work, which separation of duties must exclude.
CONSTANTS
  Reviewers = {"r", "s", "author"}
  Author = "author"
  Eligible = {"r", "s", "author"}
  Versions = {"v1", "v2"}
  Quorum = 2
  MaxTime = 1
  SeparationOfDuties = TRUE
  ImplSubject = TRUE
  ImplState = TRUE
  ImplExpiry = TRUE
  ImplDistinct = TRUE
  ImplDuty = TRUE
  ImplRole = TRUE
  ImplVerdict = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT DecisionHasRequest
INVARIANT ReviewerDecidesOnce
INVARIANT CancelledStaysUndecided
INVARIANT ImplMatchesSpec
INVARIANT NoInheritedApproval
PROPERTY EndedIsTerminal
CHECK_DEADLOCK FALSE
