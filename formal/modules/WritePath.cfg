\* The adversary controls `mallory` and `eve` (two keys, so he can co-sign with one
\* and revoke the other); `alice` is honest.
CONSTANTS
  Principals = {"alice", "mallory", "eve"}
  Corrupt = {"mallory", "eve"}
  BindKeyId = TRUE
  NoOverwrite = TRUE
  BindOwner = TRUE
  BindSigner = TRUE
  BindActor = TRUE
  CheckStatus = TRUE
  CheckCosigners = TRUE
  RevokeAuth = TRUE
  GenesisOwner = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoForgedAttribution
INVARIANT KeyBindingStable
INVARIANT NoResurrection
INVARIANT OnlyOwnerRevokes
INVARIANT NoRevokedKeyAccepted
INVARIANT NoArtifactTakeover
CHECK_DEADLOCK FALSE
