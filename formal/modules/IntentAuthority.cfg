\* Two role-holders must agree (quorum 2); `a3` holds no role; the proposer of a
\* version may not count toward selecting it.
CONSTANTS
  Versions = {"v1", "v2"}
  Actors = {"a1", "a2", "a3"}
  Owners = {"a1", "a2"}
  Quorum = 2
  SeparationOfDuties = TRUE
  CheckAuthority = TRUE
  CheckDuty = TRUE
  CheckDistinct = TRUE
  Supersede = TRUE
  NoAutoPick = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT EffectiveIntentSafety
INVARIANT EffectiveOnlyBySelection
INVARIANT EffectiveRequiresAuthority
PROPERTY NoUnauthorizedRevival
CHECK_DEADLOCK FALSE
