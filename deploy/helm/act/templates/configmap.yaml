apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "act.fullname" . }}-api-config
  labels:
    {{- include "act.labels" . | nindent 4 }}
data:
  NODE_ENV: production
  ACT_STORAGE: postgres
  ACT_OIDC_ISSUER: {{ required "api.oidc.issuer is required in production" .Values.api.oidc.issuer | quote }}
  ACT_OIDC_AUDIENCE: {{ required "api.oidc.audience is required in production" .Values.api.oidc.audience | quote }}
  ACT_ADMIN_ACTORS: {{ required "api.adminActors needs at least one administrator (OIDC subject)" (join "," .Values.api.adminActors) | quote }}
  ACT_KEY_REGISTRATION: {{ .Values.api.keyRegistration | quote }}
  ACT_REQUIRE_TENANT: {{ .Values.api.requireTenant | toString | quote }}
  ACT_MAX_TENANTS: {{ .Values.api.maxTenants | toString | quote }}
  {{- if .Values.api.tenants }}
  ACT_TENANTS: {{ join "," .Values.api.tenants | quote }}
  {{- end }}
